name: Release plugin

# Requires a Trusted Publisher entry on rubygems.org for the
# bundler-hyperdrive gem (repo, workflow release-plugin.yml, environment
# release); without it the publish step fails with an auth error.

on:
  push:
    tags:
      - "bundler-hyperdrive/v*"

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write   # create the GitHub Release
      id-token: write   # mint the RubyGems OIDC token
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Run specs
        run: bundle exec rspec

      - name: Publish to RubyGems
        uses: rubygems/release-gem@v1
        with:
          working-directory: bundler-hyperdrive
